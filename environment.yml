name: worktoy_env
channels:
  - conda-forge
dependencies:
  - python>=3.15
  - pip>=24.0
  - setuptools>=69.5.1
  - wheel>=0.43.0
  - icecream>=2.1.8  # Development only
  - pytest>=9.0.2  # Development only
  - pytest-cov>=7.0.0  # Development only
  - pyperclip>=1.11.0  # Optional, for clipboard support
  #  The documentation build, Sphinx, the furo theme and markwork, comes
  #  from docs/requirements.txt, the one list Read the Docs and the lts
  #  release workflows install from.
  - pip:
      - -r docs/requirements.txt
