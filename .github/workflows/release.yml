on:
  workflow_dispatch:

jobs:
  testJob:
    strategy:
      matrix:
        include:
          - python-version: '3.7'
            os: ubuntu-22.04
          - python-version: '3.8'
            os: ubuntu-latest
          - python-version: '3.9'
            os: ubuntu-latest
          - python-version: '3.10'
            os: ubuntu-latest
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
          - python-version: '3.14'
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        continue-on-error: ${{ matrix.python-version == '3.14' }}

      - name: Inform if Python 3.14 is unavailable
        if: ${{ matrix.python-version == '3.14' && failure() }}
        run: |
          echo "Python 3.14 is not yet available in GitHub Actions."
          echo "Unit tests for versions 3.7 to 3.13 did pass successfully."
          echo "Publication will proceed."

      - name: Set RUNNING_TESTS environment variable
        run: echo "RUNNING_TESTS=1" >> $GITHUB_ENV

      - name: Install Dependencies
        if: ${{ success() || matrix.python-version != '3.14' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Add project directory to PYTHONPATH
        if: ${{ success() || matrix.python-version != '3.14' }}
        run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Run Tests
        if: ${{ success() || matrix.python-version != '3.14' }}
        run: |
          python -m unittest discover -s tests

      - name: Run test coverage
        if: ${{ matrix.python-version == '3.14'}}
        run: pytest --cov --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        if: ${{ matrix.python-version == '3.14'}}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AsgerJon/WorkToy
  

  continue:
    runs-on: ubuntu-latest
    needs: testJob

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Add project directory to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Update Version
        run: |
          python roll_version.py patch

      - name: Read Version Tag
        id: read_tag
        run: |
          echo "TAG_NAME=$(<worktoy-tag.txt)" >> $GITHUB_ENV

      - name: Configure Git User Info
        run: |
          git config --local user.name "Asger Jon Vistisen"
          git config --local user.email "asgerjon2@gmail.com"

      - name: Get the commit message
        id: get_commit_message
        run: |
          commit_message=$(git log -1 --pretty=%B)
          echo "commit_message=$commit_message" >> $GITHUB_ENV

      - name: Commit changes
        run: |
          git add pyproject.toml
          git add worktoy_version.json
          git add worktoy-tag.txt
          git commit -m "${{ env.commit_message }}"

      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}

      - name: Build Package
        run: python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.GITHUB2024 }}
          skip-existing: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.14.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generateReleaseNotes: true

  #  GitHub Pages publication. Runs only as part of this manually-
  #  triggered release and only after 'continue' succeeds, so the
  #  PyPI publish has gone through and the new tag exists. Order
  #  within the job is deliberate: BUILD every version first, THEN
  #  deploy to GitHub Pages. worktoy is NOT installed: our build
  #  reads source as text.
  #
  #  Read the Docs is NOT touched here. RTD builds itself from
  #  .readthedocs.yaml, and is configured (on the RTD side) to build
  #  ONLY when a release tag appears - not on every push. So the tag
  #  the 'continue' job just cut is what makes RTD build the new
  #  version; this workflow does not need an RTD token or trigger.
  docs:
    needs: continue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # to delete stale Pages artifacts on a re-run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (full history, for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # ---- build (after PyPI; nothing is published yet) ----
      - name: Build all versions
        run: |
          set -e
          mkdir -p site

          # 'latest' is the current commit (main, with the version bump
          # the 'continue' job just pushed).
          sphinx-build -b html docs site/latest
          versions='"latest"'

          # Each tag that already contains the docs generator gets its
          # own build. Tags from before the docs system are skipped.
          for tag in $(git tag --sort=-version:refname); do
            if git cat-file -e "$tag:docs/_gen.py" 2>/dev/null; then
              git worktree add --detach ../version-build "$tag"
              sphinx-build -b html ../version-build/docs "site/$tag"
              git worktree remove --force ../version-build
              versions="$versions,\"$tag\""
            fi
          done

          printf '[%s]\n' "$versions" > site/versions.json
          printf '%s\n' \
            '<!doctype html><meta http-equiv="refresh" content="0; url=latest/">' \
            > site/index.html

      # ---- publish (only the build above is shipped) ----
      # A previous FAILED attempt of this job leaves its
      # 'github-pages' artifact behind in the run; on a re-run the
      # upload below adds a second one, and deploy-pages then aborts
      # with "Multiple artifacts named github-pages". Delete any
      # leftovers first so this attempt uploads exactly one. On the
      # normal first attempt there are none and this is a no-op.
      - name: Remove stale Pages artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
