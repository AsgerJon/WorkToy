name: docs

# Build the Sphinx docs for every version and publish them to GitHub
# Pages on each push to main (and on manual dispatch). This publishes
# the same site that `./build_docs.sh` produces locally, once per
# version, under <version>/ subdirectories with a version switcher.
#
# worktoy is NOT installed: the build only reads source files as text.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build all versions
        run: |
          set -e
          mkdir -p site

          # 'latest' is the current commit (the default branch).
          sphinx-build -b html docs site/latest
          versions='"latest"'

          # Each tag that already contains the docs generator gets its
          # own build. Tags from before the docs system are skipped
          # (they have no docs/_gen.py and could not build).
          for tag in $(git tag --sort=-version:refname); do
            if git cat-file -e "$tag:docs/_gen.py" 2>/dev/null; then
              git worktree add --detach ../version-build "$tag"
              sphinx-build -b html ../version-build/docs "site/$tag"
              git worktree remove --force ../version-build
              versions="$versions,\"$tag\""
            fi
          done

          # versions.json (read by the switcher) and a root redirect.
          printf '[%s]\n' "$versions" > site/versions.json
          printf '%s\n' \
            '<!doctype html><meta http-equiv="refresh" content="0; url=latest/">' \
            > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
