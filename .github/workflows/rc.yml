# Release candidate: the stabilising button. Publishes the next release
# candidate (X.Y.Z-rcN) to PyPI as a pre-release. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        include:
          - { python-version: '3.7', os: ubuntu-22.04 }
          - { python-version: '3.8', os: ubuntu-latest }
          - { python-version: '3.9', os: ubuntu-latest }
          - { python-version: '3.10', os: ubuntu-latest }
          - { python-version: '3.11', os: ubuntu-latest }
          - { python-version: '3.12', os: ubuntu-latest }
          - { python-version: '3.13', os: ubuntu-latest }
          - { python-version: '3.14', os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          RUNNING_TESTS: '1'
        run: python -m unittest discover -s tests
      - name: Coverage (3.14 only)
        if: ${{ matrix.python-version == '3.14' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          RUNNING_TESTS: '1'
        run: |
          pip install pytest pytest-cov
          pytest --cov --cov-branch --cov-report=xml
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AsgerJon/WorkToy

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) to PyPI
      contents: write   # push the version bump and cut the release
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Compute the next rc version from VERSION and expose it as
      # VERSION_INFO in the environment for the steps below.
      - name: Resolve next version
        run: python version_get.py rc

      # Write VERSION_INFO into pyproject.toml (the build reads its
      # version from there) and into worktoy-tag.txt (docs/conf.py
      # reads that for the version header).
      - name: Stamp version into pyproject.toml and tag file
        run: |
          python - <<'PY'
          import os
          path = "pyproject.toml"
          version = os.environ["VERSION_INFO"]
          lines = open(path, encoding="utf-8").read().splitlines()
          for i, line in enumerate(lines):
              if line.lstrip().startswith("version") and "=" in line:
                  lines[i] = 'version = "%s"' % version
                  break
          open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY
          printf '%s' "$VERSION_INFO" > worktoy-tag.txt

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Only reached if the publish above succeeded: advance the
      # counters in VERSION, then commit VERSION + the stamped files.
      - name: Bump version counters
        run: python version_bump.py rc

      - name: Commit version changes
        run: |
          git config user.name "Asger Jon Vistisen"
          git config user.email "asgerjon2@gmail.com"
          git add VERSION pyproject.toml worktoy-tag.txt
          git commit -m "rc ${{ env.VERSION_INFO }}"
          git push origin HEAD:${{ github.ref }}

      - name: GitHub pre-release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ env.VERSION_INFO }}
          name: rc ${{ env.VERSION_INFO }}
          prerelease: true
          generateReleaseNotes: true
