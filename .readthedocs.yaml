# Read the Docs build configuration.
#
# RTD reads this from the repo root, builds docs/conf.py with the
# given Python, and hosts the result with per-tag versioning.
#
# The build does NOT install worktoy: markwork, the Sphinx extension
# that generates the pages, reads the source files as text and never
# imports the package. The toolchain is Sphinx, the furo theme and
# markwork, all installed from docs/requirements.txt.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
