[build-system]
requires = ['setuptools>=69.5.1']
build-backend = 'setuptools.build_meta'


[project]
name = "worktoy"
version = "1.0.0-rc20"
authors = [
    { name = "Asger Jon Vistisen", email = "asgerjon2@gmail.com" },
]
description = "Declarative structure for Python that enforces types at runtime and enables true function overloading"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.7"
classifiers = [
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Utilities"
]

[project.urls]
"Homepage" = "https://github.com/AsgerJon/WorkToy"
"Bug Tracker" = "https://github.com/AsgerJon/WorkToy/issues"

[dependency-groups]
test = [
    'pytest>=9.0.2',
    'pytest-cov>=7.0.0',
]
docs = [
    'sphinx>=7.0.0',
    'pygments>=2.19.2',
]
dev = [
    'icecream>=2.1.8',
    'pyperclip>=1.11.0',
    { include-group = 'test' },
    { include-group = 'docs' },
]

[tool.setuptools.package-data]
worktoy = ["py.typed"]

[tool.coverage.run]
omit = [
    # Pre-PEP 634 fallback. Unreachable on 3.14 where coverage
    # runs; exercised by unittest on <3.10.
    "tests/test_ezdata/_match_args_legacy_helpers.py",
]

# pytest configuration lives here rather than in a root 'pytest.ini' so
# the repository root stays uncluttered. pytest auto-discovers this
# table, so no '-c' flag is needed locally or in CI.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=worktoy --cov=tests --cov-branch --cov-report=term-missing"
