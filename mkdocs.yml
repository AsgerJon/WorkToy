site_name: worktoy
site_description: Collection of Utilities
site_author: Asger Jon Vistisen
site_url: https://worktoy.readthedocs.io/
repo_url: https://github.com/AsgerJon/WorkToy
repo_name: AsgerJon/WorkToy
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_root_heading: false
            show_root_full_path: false
            show_source: false
            members_order: source
            heading_level: 3
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters:
              - "!^_"

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
      - utilities: api/utilities.md
      - waitaminute: api/waitaminute.md
      - core: api/core.md
      - dispatch: api/dispatch.md
      - desc: api/desc.md
      - mcls: api/mcls.md
      - lorem_ipsum: api/lorem_ipsum.md
      - keenum: api/keenum.md
      - ezdata: api/ezdata.md
      - work_io: api/work_io.md
      - work_test: api/work_test.md